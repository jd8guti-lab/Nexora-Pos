<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/portal/las-dos-palmas/isotype.png" />
    <!--
      Poppins es la tipografía de nexora-pos. La pila de reserva es la del sistema: si el equipo
      está sin internet —pasa en la bodega— la aplicación se ve normal, no descuadrada.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Las dos palmas</title>
    <style>
      .arranque {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #626976;
        font: 14px Poppins, system-ui, sans-serif;
      }
      .arranque-giro {
        width: 36px;
        height: 36px;
        border: 3px solid #ededed;
        border-top-color: #ff7a00;
        border-radius: 50%;
        animation: arranque-giro 800ms linear infinite;
      }
      @keyframes arranque-giro {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/portal/las-dos-palmas/assets/index-Dkv1yGV9.js"></script>
    <link rel="stylesheet" crossorigin href="/portal/las-dos-palmas/assets/index-Bu0ydY9n.css">
  </head>
  <body>
    <!--
      Lo que se ve mientras baja el JavaScript, que sin esto es una pantalla en blanco. Va dentro de
      #root porque React lo reemplaza al montar, y en CSS propio porque el de la app todavia no llego.
    -->
    <div id="root">
      <div class="arranque" role="status">
        <span class="arranque-giro" aria-hidden="true"></span>
        <span>Cargando…</span>
      </div>
    </div>
  </body>
</html>
